<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', 'Segoe UI Symbol', 'Noto Sans', sans-serif;
    background: linear-gradient(135deg, #e0f2fe, #fef9c3);
    overflow-x: hidden;
    position: relative;
}

/* Particle background */
.particle {
    position: absolute;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    pointer-events: none;
    animation: float 15s linear infinite;
}
@keyframes float {
    0% { transform: translateY(100vh) translateX(0) scale(0.5); opacity:0.5; }
    100% { transform: translateY(-100vh) translateX(100px) scale(1); opacity:1; }
}

/* Fade-in animation */
.fade-in {
    opacity: 0;
    animation: fadeIn 1s forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

/* Photo hover glow + pulse */
.photo-hover {
    border-radius: 50%;
    transition: transform 0.5s ease, box-shadow 0.5s ease;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    animation: pulse 2.5s infinite;
}
.photo-hover:hover {
    transform: scale(1.15);
    box-shadow: 0 0 40px 10px rgba(59,130,246,0.8);
    animation: none;
}
@keyframes pulse {
    0%,100% { box-shadow: 0 0 25px rgba(59,130,246,0.4); }
    50% { box-shadow: 0 0 40px rgba(59,130,246,0.6); }
}

/* Buttons */
.btn-hover {
    position: relative;
    overflow: hidden;
    font-weight: 600;
    border-radius: 9999px;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background-size: 200% 200%;
    animation: gradientShift 4s ease infinite;
    text-shadow: 0 0 4px rgba(255,255,255,0.8);
}
.btn-hover:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 25px rgba(0,0,0,0.35), 0 0 20px rgba(255,255,255,0.5);
}
@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.btn-hover i {
    transition: transform 0.3s ease;
}
.btn-hover:hover i {
    transform: translateY(-4px);
}

/* Horizontal scroll */
.scroll-x {
    display: flex;
    gap: 1rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
}
.scroll-x::-webkit-scrollbar { height: 6px; }
.scroll-x::-webkit-scrollbar-thumb { background: rgba(107,114,128,0.5); border-radius: 3px; }
.scroll-x::-webkit-scrollbar-track { background: transparent; }

/* Bottom text animation */
.bottom-text {
    animation: fadeIn 1.2s forwards;
    opacity: 0;
}
</style>
